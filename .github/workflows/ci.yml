# Types, tests and secrets scan on every PR and on main.
#
# There is no automated publish step: a release is a person cutting a `v*` tag
# on main (CONTRIBUTING.md → Releasing).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The token stays out of .git/config, where every later step (npm
          # install scripts included) could read it. Nothing here pushes.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Install Gitleaks binary to execute repo-native npm run secrets:scan
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.24.3"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Secrets scan (npm run secrets:scan)
        run: npm run secrets:scan

      # Third-party, so pinned to a commit: a tag can be moved. The token is
      # what it lists a pull request's commits with (read-only here).
      - name: Secrets scan (SARIF report)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
