name: Bug Report
description: Report a bug or unexpected behavior in the Cruise Antigravity plugin
title: "fix: [short description]"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much context as possible.
        *Never include real API keys or sensitive project credentials.*
  - type: input
    id: version
    attributes:
      label: Plugin & Antigravity Version
      description: What version of cruise-antigravity-plugin and Antigravity (IDE or agy CLI) are you running?
      placeholder: "e.g., plugin 0.1.0, agy 2.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue.
      placeholder: |
        1. In Antigravity prompt '...'
        2. Plugin invokes lane 'bb/agentic-coding'
        3. See error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Any relevant error output or MCP logs (redact any tokens).
      render: shell
