name: Feature Request
description: Suggest an idea or enhancement for the Cruise Antigravity plugin
title: "feat: [short description]"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have a feature request or workflow improvement? Let us know!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? Please describe.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe the solution or workflow you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
